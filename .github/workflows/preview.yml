# ============================================================================
# FASE 14 — AMBIENTE DE PREVIEW PARA TESTE HUMANO
#
# POR QUE O PREVIEW NASCE AQUI, E NÃO NUM PROVEDOR DE HOSPEDAGEM
#
# A rede onde o agente trabalha só alcança o GitHub: medido host a host, o
# CONNECT para render.com, vercel, netlify, fly.io, railway, deno, ngrok,
# cloudflare e todos os provedores de túnel volta 403 por política. O runner do
# Actions, ao contrário, tem internet. Ele é o único lugar de onde este projeto
# consegue publicar qualquer coisa.
#
# O QUE ESTE WORKFLOW FAZ
#
#   sobe PostgreSQL, aplica migrations, cria o papel de aplicação SEM
#   superusuário (senão o RLS não valeria nada), sobe a API em modo produção,
#   semeia o conjunto de demonstração, constrói o frontend, publica os dois
#   pela Cloudflare, VERIFICA tudo pela URL pública e fica de pé.
#
# O QUE ELE NÃO FAZ
#
#   não toca na main, não faz merge, não faz deploy em produção e não usa
#   nenhuma credencial do ambiente real. O banco nasce e morre com o job.
#
# ATENÇÃO — ESTE AMBIENTE É PÚBLICO
#
# O repositório é público, e log de Actions de repositório público é público.
# A URL e as senhas de QA impressas aqui podem ser lidas por qualquer pessoa.
# Por isso: todos os dados são FICTÍCIOS, as contas entregues têm o mínimo de
# permissão, e a conta administrativa usada só para semear recebe uma senha
# aleatória que NÃO é impressa — ninguém, nem quem escreveu isto, consegue
# usá-la depois. Nada de dado real entra aqui.
# ============================================================================
name: Preview QA

on:
  push:
    branches:
      - claude/mci-platform-muscle-contest-o6haz9
    paths:
      # Só sobe quando alguém PEDE. Um push de código comum não deve levantar
      # ambiente: o preview custa tempo de runner e publica uma URL.
      - '.github/workflows/preview.yml'
      - '.github/preview.trigger'

  # O tunel da Cloudflare morre junto com o job, e o job tem teto de tempo.
  # Quando o ambiente cai, quem precisa dele tem de poder levanta-lo sozinho,
  # sem depender de um commit: Actions -> Preview QA -> Run workflow.
  workflow_dispatch:

concurrency:
  group: preview-qa
  cancel-in-progress: true

permissions:
  # Escrita porque o endereço do preview precisa sair do runner por um canal
  # LEGÍVEL enquanto o job ainda roda. O log de Actions só fica disponível
  # depois que o job termina — e este job termina quando o ambiente cai, o que
  # é tarde demais para quem precisa da URL agora. O workflow publica o estado
  # num branch próprio, `preview-estado`, que não é a main nem o branch de
  # trabalho.
  contents: write

jobs:
  preview:
    name: Publicar preview de QA
    runs-on: ubuntu-latest
    # Teto do GitHub é 360. O ambiente vive o que o job viver.
    timeout-minutes: 350

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mci
          POSTGRES_PASSWORD: mci_preview_ci
          POSTGRES_DB: mci_preview
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mci -d mci_preview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # O dono do schema NÃO é o usuário de bootstrap da imagem: aquele nasce
      # superusuário, e superusuário ignora RLS mesmo com FORCE. Um preview que
      # rodasse com ele mostraria uma barreira que não existe.
      DATABASE_URL: postgresql://mci_owner:mci_owner_preview@localhost:5432/mci_preview?schema=public
      PORTA_API: '4700'
      PORTA_WEB: '5700'
      MINUTOS_NO_AR: '330'

    steps:
      - uses: actions/checkout@v4

      - name: Registrar o SHA publicado
        run: |
          echo "SHA_PUBLICADO=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHA_CURTO=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Criar o papel dono do schema, sem superusuário
        env:
          PGPASSWORD: mci_preview_ci
        run: |
          set -e
          PSQL="psql -h localhost -U mci -d mci_preview -v ON_ERROR_STOP=1"
          # CREATEDB porque os testes essenciais rodam num banco PRÓPRIO: usar o
          # mesmo banco do preview deixaria resíduo de teste dentro do
          # ambiente que o responsável vai abrir. CREATEROLE pelo mesmo motivo
          # da CI. Nenhum dos dois é superusuário — o RLS continua valendo.
          $PSQL -c "CREATE ROLE mci_owner LOGIN PASSWORD 'mci_owner_preview' NOSUPERUSER CREATEROLE CREATEDB"
          $PSQL -c "GRANT ALL ON DATABASE mci_preview TO mci_owner"
          $PSQL -c "ALTER SCHEMA public OWNER TO mci_owner"
          PGPASSWORD=mci_owner_preview psql -h localhost -U mci_owner -d mci_preview -v ON_ERROR_STOP=1 -qc \
            "DO \$\$ BEGIN IF current_setting('is_superuser') = 'on' THEN RAISE EXCEPTION 'papel da aplicacao e superusuario: o RLS nao teria efeito'; END IF; END \$\$"

      # ------------------------------------------------------------------ §4
      - name: Validar schema e gerar client
        run: |
          npx prisma validate
          npx prisma generate

      - name: ESLint
        run: npx eslint .

      - name: Migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Catálogo oficial
        run: node prisma/seed.js

      # Subconjunto essencial: regra esportiva, histórico, RLS em execução e
      # segurança. A suíte inteira roda no workflow de CI, a cada push.
      - name: Testes essenciais
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://mci_owner:mci_owner_preview@localhost:5432/mci_preview_test?schema=public
          STORAGE_DIR: ./uploads-test
          JWT_SECRET: preview-essencial-segredo-com-tamanho-mais-que-suficiente
          BCRYPT_ROUNDS: '4'
          LOG_LEVEL: silent
        run: |
          set -e
          PGPASSWORD=mci_owner_preview createdb -h localhost -U mci_owner mci_preview_test
          npx prisma migrate deploy
          node prisma/seed.js
          npx vitest run \
            tests/unidade-dominio.test.mjs \
            tests/pontuacao-oficial.test.mjs \
            tests/regulamento-overall-vigente.test.mjs \
            tests/homologacao-overall.test.mjs \
            tests/meu-historico.test.mjs \
            tests/ranking-publico-top5.test.mjs \
            tests/rls-runtime.test.mjs \
            tests/superficie-publica.test.mjs

      # ------------------------------------------------------------------ §2
      - name: Instalar o cliente do túnel
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      # Os dois túneis sobem ANTES da aplicação: a API precisa saber a origem
      # do frontend para o CORS, e o frontend precisa saber a URL da API em
      # tempo de build. Sem os endereços de antemão, um dos dois ficaria com o
      # valor errado.
      - name: Abrir os túneis
        run: |
          set -e
          abrir() {
            local porta="$1" arquivo="$2"
            cloudflared tunnel --no-autoupdate --url "http://localhost:${porta}" > "$arquivo" 2>&1 &
            for _ in $(seq 1 60); do
              url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$arquivo" | head -1 || true)
              [ -n "$url" ] && { echo "$url"; return 0; }
              sleep 2
            done
            echo "túnel na porta ${porta} não devolveu URL" >&2
            tail -40 "$arquivo" >&2
            return 1
          }

          URL_API=$(abrir "$PORTA_API" /tmp/tunel-api.log)
          URL_WEB=$(abrir "$PORTA_WEB" /tmp/tunel-web.log)

          echo "URL_API=$URL_API" >> "$GITHUB_ENV"
          echo "URL_WEB=$URL_WEB" >> "$GITHUB_ENV"
          echo "API  $URL_API"
          echo "WEB  $URL_WEB"

      - name: Gerar segredos do ambiente
        run: |
          # O JWT_SECRET é do ambiente e morre com ele; não é impresso.
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # A senha da conta administrativa serve só para semear. Aleatória e
          # NUNCA impressa: depois da semeadura ninguém consegue usá-la.
          echo "SENHA_ADMIN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          # A senha das contas de QA é entregue ao responsável, e por isso é
          # impressa. Ver o aviso no cabeçalho: este ambiente é público.
          echo "DEMO_PASSWORD=preview-mci-$(openssl rand -hex 6)" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ §3
      #
      # A API SOBE DUAS VEZES, E O MOTIVO É O LIMITADOR DE AUTENTICAÇÃO.
      #
      # `limiteAutenticacao` corta em 10 chamadas de `/auth/*` por origem a cada
      # 15 minutos. Toda a semeadura sai de 127.0.0.1, ou seja de UMA origem: o
      # conjunto do demo já gasta parte da cota, e o cenário do módulo Treinadores
      # precisa de seis cadastros e três entradas. A execução 8 morreu exatamente
      # aí, com 429 no meio da semeadura.
      #
      # Baixar o limite não é opção: ele é barreira de verdade, e a execução do
      # preview é onde ela precisa estar ligada. Semear com o limitador DESLIGADO e
      # RELIGÁ-LO antes de qualquer coisa pública resolve sem afrouxar nada:
      #
      #   * durante a semeadura nada foi anunciado — o limitador não protege
      #     ninguém ali, e a semeadura é tráfego conhecido e local;
      #   * o ambiente ENTREGUE roda com o limitador ligado, igual a antes;
      #   * a verificação pela URL pública faz entradas de verdade DEPOIS do
      #     religamento, então a barreira continua sendo medida.
      #
      # O estado do limitador vive no processo: reiniciar zera a contagem.
      - name: Subir a API para semear (limitador desligado)
        env:
          NODE_ENV: production
          PORT: '4700'
          BCRYPT_ROUNDS: '12'
          RATE_LIMIT_ENABLED: 'false'
          # A Cloudflare fica na frente: um salto.
          TRUST_PROXY_HOPS: '1'
          LOG_LEVEL: info
          STORAGE_DRIVER: local
          # Assumido de propósito para o preview: o disco do runner é efêmero e
          # o upload some com o job. Em produção a barreira RECUSA subir assim,
          # porque ali a perda seria documento de atleta.
          ALLOW_LOCAL_STORAGE: 'true'
          STORAGE_DIR: ./uploads-preview
          DEFAULT_TIMEZONE: America/Sao_Paulo
        run: |
          set -e
          CORS_ORIGINS="$URL_WEB" nohup node server.js > /tmp/api.log 2>&1 &
          # O PID VAI PARA ARQUIVO, e o religamento mata por ele.
          #
          # `pkill -f 'node server.js'` parece o caminho óbvio e é uma armadilha:
          # o `-f` casa a linha de comando INTEIRA, e a linha do próprio passo do
          # workflow contém a string `node server.js` — o `pkill` mata o shell que
          # o executa. Medido nesta sessão, num comando local: código 144, o passo
          # morre antes de subir nada.
          echo $! > /tmp/api.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORTA_API}/health" >/dev/null 2>&1; then
              echo "API no ar."
              exit 0
            fi
            sleep 2
          done
          echo "a API não subiu:" >&2
          tail -60 /tmp/api.log >&2
          exit 1

      # ------------------------------------------------------------------ §7 §8 §9
      - name: Semear o conjunto de demonstração
        env:
          # NÃO em modo produção de propósito: a barreira de configuração de
          # produção exige CORS e armazenamento de objetos, que são assunto do
          # PROCESSO DA API, não deste utilitário. O que importa aqui é o custo
          # do bcrypt, e ele está declarado.
          NODE_ENV: development
          BCRYPT_ROUNDS: '12'
          LOG_LEVEL: error
        run: |
          set -e
          # A conta administrativa nasce pelo caminho próprio da aplicação: não
          # existe rota de autopromoção, e não deve existir.
          ADMIN_PASSWORD="$SENHA_ADMIN" \
            node scripts/criar-admin.js "QA DEMO Semeadura" semeadura.qa@mci.local

          DEMO_ADMIN_PASSWORD="$SENHA_ADMIN" node scripts/qa/demo.mjs \
            --api "http://127.0.0.1:${PORTA_API}/api/v1" \
            --admin-email semeadura.qa@mci.local | tee /tmp/demo.log

          # As contas ENTREGUES são as de menor privilégio possível para o que
          # a fase pede testar: a operadora tem direção de evento e gerência de
          # ranking (é o que `ranking.manage` exige), a atleta não tem nenhuma.
          echo "EMAIL_OPERADOR=$(grep -oE 'demo\.diretora\.[a-z0-9]+@mci\.local' /tmp/demo.log | head -1)" >> "$GITHUB_ENV"
          echo "EMAIL_ATLETA=$(grep -oE 'demo\.atleta\.[a-z0-9]+@mci\.local' /tmp/demo.log | head -1)" >> "$GITHUB_ENV"

      # ---------------------------------------------- MÓDULO TREINADORES & EQUIPES
      #
      # Passo PRÓPRIO, e não uma linha dentro do demo: o cenário do módulo tem
      # quatro autoridades distintas (central aprova cadastro, federação autoriza
      # atuação, treinador pede vínculo, atleta confirma) e o demo não conhece
      # nenhuma delas. Sem isto o preview subia sem uma única conta de treinador,
      # e o módulo ficava sem como ser testado por uma pessoa.
      #
      # Os endereços são FIXOS e legíveis porque alguém vai digitá-los. O banco do
      # preview nasce vazio a cada execução, então não há colisão a temer.
      - name: Semear o módulo Treinadores & Equipes
        env:
          NODE_ENV: development
          BCRYPT_ROUNDS: '12'
          LOG_LEVEL: error
        run: |
          set -e
          node scripts/qa/semear-treinadores.mjs \
            --api "http://127.0.0.1:${PORTA_API}/api/v1" \
            --admin-email semeadura.qa@mci.local \
            --admin-password "$SENHA_ADMIN" \
            --senha "$DEMO_PASSWORD" | tee /tmp/treinadores.log

          for chave in CENTRAL DIRETOR TREINADOR SUSPENSO ATLETA DELEGADO; do
            linha="$(grep -oE "TREINADORES_EMAIL_${chave}=[^ ]+" /tmp/treinadores.log | head -1)"
            [ -n "$linha" ] || { echo "a semeadura não devolveu TREINADORES_EMAIL_${chave}" >&2; exit 1; }
            echo "$linha" >> "$GITHUB_ENV"
          done

      # O RELIGAMENTO. Mata o processo da semeadura e sobe outro com o limitador
      # ligado — é o processo que vai atender a pessoa que abrir a URL.
      - name: Religar a API com o limitador ligado
        env:
          NODE_ENV: production
          PORT: '4700'
          BCRYPT_ROUNDS: '12'
          RATE_LIMIT_ENABLED: 'true'
          TRUST_PROXY_HOPS: '1'
          LOG_LEVEL: info
          STORAGE_DRIVER: local
          ALLOW_LOCAL_STORAGE: 'true'
          STORAGE_DIR: ./uploads-preview
          DEFAULT_TIMEZONE: America/Sao_Paulo
        run: |
          set -e
          # MATAR PELO PID GRAVADO, e não por padrão de linha de comando: ver o
          # comentário na primeira subida — `pkill -f 'node server.js'` casaria a
          # linha DESTE passo e mataria o próprio shell.
          if [ -f /tmp/api.pid ]; then kill "$(cat /tmp/api.pid)" 2>/dev/null || true; fi
          for _ in $(seq 1 15); do
            curl -fsS "http://127.0.0.1:${PORTA_API}/health" >/dev/null 2>&1 || break
            sleep 1
          done

          CORS_ORIGINS="$URL_WEB" nohup node server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORTA_API}/health" >/dev/null 2>&1; then
              echo "API religada, com limitador."
              exit 0
            fi
            sleep 2
          done
          echo "a API não voltou depois do religamento:" >&2
          tail -60 /tmp/api.log >&2
          exit 1

      - name: Construir e servir o frontend
        run: |
          set -e
          VITE_API_URL="${URL_API}/api/v1" npm --prefix frontend run build
          nohup node scripts/qa/servir-estatico.mjs \
            --dir frontend/dist --porta "$PORTA_WEB" --host 0.0.0.0 > /tmp/web.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:${PORTA_WEB}/" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "o frontend não subiu:" >&2
          tail -40 /tmp/web.log >&2
          exit 1

      - name: Esperar os túneis responderem de fora
        run: |
          set -e
          for alvo in "${URL_API}/health" "${URL_WEB}/"; do
            ok=""
            for _ in $(seq 1 45); do
              if curl -fsS --max-time 10 "$alvo" >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "sem resposta pública em $alvo" >&2; exit 1; }
            echo "público OK: $alvo"
          done

      # O CADASTRO É VERIFICADO PRIMEIRO, E É O PASSO QUE FALTAVA.
      #
      # O responsável abriu o preview, preencheu o cadastro de Treinador
      # (Equipe), clicou em "Criar conta" e leu "Não foi possível conectar à
      # API." — com a verificação abaixo tendo passado. As duas coisas eram
      # verdadeiras: `preview-verificacao.mjs` mede saúde, CORS, ranking
      # público, segurança e o fluxo do operador, e nunca tocou
      # `POST /auth/register`. O caminho que a pessoa usou não estava medido, e
      # por isso um preview podia ser anunciado com ele quebrado.
      - name: Verificar o cadastro de treinador no navegador
        id: verificacao_cadastro
        continue-on-error: true
        run: |
          set -e
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/qa/cadastro-treinador-navegador.mjs \
            --web "$URL_WEB" \
            --api "$URL_API" \
            --senha "$DEMO_PASSWORD" \
            --diretor "$TREINADORES_EMAIL_DIRETOR" \
            --central "$TREINADORES_EMAIL_CENTRAL"

      # REINÍCIO SÓ PARA ZERAR A CONTAGEM DO LIMITADOR, entre as duas
      # verificações. Cada uma faz entradas de verdade, e `limiteAutenticacao`
      # corta em 10 chamadas de `/auth/*` por origem a cada 15 minutos: somadas,
      # as duas passam perto do teto, e a segunda levaria 429 por causa da
      # primeira — medindo o limitador em vez do ambiente.
      #
      # Nada foi anunciado ainda neste ponto (a URL só é publicada depois), o
      # limitador continua LIGADO no processo que sobe aqui, e o estado dele vive
      # no processo: reiniciar zera a contagem sem afrouxar nada.
      - name: Zerar a contagem do limitador entre as verificações
        env:
          NODE_ENV: production
          PORT: '4700'
          BCRYPT_ROUNDS: '12'
          RATE_LIMIT_ENABLED: 'true'
          TRUST_PROXY_HOPS: '1'
          LOG_LEVEL: info
          STORAGE_DRIVER: local
          ALLOW_LOCAL_STORAGE: 'true'
          STORAGE_DIR: ./uploads-preview
          DEFAULT_TIMEZONE: America/Sao_Paulo
        run: |
          set -e
          if [ -f /tmp/api.pid ]; then kill "$(cat /tmp/api.pid)" 2>/dev/null || true; fi
          sleep 2
          CORS_ORIGINS="$URL_WEB" nohup node server.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORTA_API}/health" >/dev/null 2>&1; then
              echo "API reiniciada; contagem do limitador zerada."
              exit 0
            fi
            sleep 2
          done
          echo "a API não voltou:" >&2
          tail -60 /tmp/api.log >&2
          exit 1

      # ------------------------------------------------------- §5 §6 §10–§14
      - name: Verificar o preview pela URL pública
        id: verificacao
        continue-on-error: true
        run: |
          set -e
          # O pacote é instalado SEM gravar no package.json: o Playwright não é
          # dependência do projeto — a interface não precisa dele para rodar, e
          # colocá-lo no pacote faria todo deploy baixar um navegador.
          #
          # `npx playwright install` sozinho não basta: ele baixa o NAVEGADOR,
          # não o módulo. A primeira execução deste workflow morreu exatamente
          # aí — o `import 'playwright'` estourava antes da primeira asserção, e
          # a verificação "falhava" sem ter medido nada.
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/qa/preview-verificacao.mjs \
            --web "$URL_WEB" \
            --api "$URL_API" \
            --operador "$EMAIL_OPERADOR" \
            --atleta "$EMAIL_ATLETA" \
            --senha "$DEMO_PASSWORD"

      - name: Publicar o endereço
        run: |
          {
            echo "## PREVIEW ONLINE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| PREVIEW URL | ${URL_WEB} |"
            echo "| API URL | ${URL_API} |"
            echo "| BRANCH | ${GITHUB_REF_NAME} |"
            echo "| SHA | ${SHA_PUBLICADO} |"
            echo "| AMBIENTE | QA/PREVIEW |"
            echo "| VERIFICAÇÃO | ${{ steps.verificacao.outcome }} |"
            echo "| VERIFICAÇÃO DO CADASTRO | ${{ steps.verificacao_cadastro.outcome }} |"
            echo "| EXPIRA EM | $(date -u -d "+${MINUTOS_NO_AR} minutes" '+%Y-%m-%d %H:%M UTC') · $(TZ=America/Sao_Paulo date -d "+${MINUTOS_NO_AR} minutes" '+%d/%m %H:%M') (Brasília) |"
            echo "| OPERADOR | ${EMAIL_OPERADOR} |"
            echo "| ATLETA | ${EMAIL_ATLETA} |"
            echo "| SENHA (todas) | ${DEMO_PASSWORD} |"
            echo
            echo "### Módulo Treinadores & Equipes"
            echo
            echo "| Perfil | Usuário |"
            echo "|---|---|"
            echo "| Administração Central | ${TREINADORES_EMAIL_CENTRAL} |"
            echo "| Diretor de Federação | ${TREINADORES_EMAIL_DIRETOR} |"
            echo "| Treinador (Equipe) — aprovado | ${TREINADORES_EMAIL_TREINADOR} |"
            echo "| Treinador suspenso | ${TREINADORES_EMAIL_SUSPENSO} |"
            echo "| Atleta com convite pendente | ${TREINADORES_EMAIL_ATLETA} |"
            echo "| Delegado central | ${TREINADORES_EMAIL_DELEGADO} |"
            echo
            echo "Telas: \`/#/treinador\` · \`/#/minha-equipe\` · \`/#/admin/treinadores\` · \`/#/admin/auditoria\`"
            echo
            echo "Ambiente público e efêmero, com dados fictícios. Vive ${MINUTOS_NO_AR} minutos."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "================== PREVIEW ONLINE =================="
          echo "PREVIEW URL: ${URL_WEB}"
          echo "API URL:     ${URL_API}"
          echo "BRANCH:      ${GITHUB_REF_NAME}"
          echo "SHA:         ${SHA_PUBLICADO}"
          echo "AMBIENTE:    QA/PREVIEW"
          echo "VERIFICACAO: ${{ steps.verificacao.outcome }}"
          echo "OPERADOR:    ${EMAIL_OPERADOR}"
          echo "ATLETA:      ${EMAIL_ATLETA}"
          echo "SENHA:       ${DEMO_PASSWORD}"
          echo "==================================================="

      - name: Publicar o estado num branch legível
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # O PRAZO ABSOLUTO, e não só a duração.
          #
          # O arquivo dizia "vive por 330 minutos" e nada mais. Quem lê depois
          # não sabe quando ele subiu, então não sabe se a URL ainda vale — e o
          # primeiro sinal de que a janela fechou é a tela dizendo "Não foi
          # possível conectar à API." no meio de um cadastro, que é o que
          # aconteceu. A hora de expirar sai aqui, nos dois fusos.
          EXPIRA_UTC="$(date -u -d "+${MINUTOS_NO_AR} minutes" '+%Y-%m-%d %H:%M UTC')"
          EXPIRA_BR="$(TZ=America/Sao_Paulo date -d "+${MINUTOS_NO_AR} minutes" '+%d/%m %H:%M')"
          cat > /tmp/PREVIEW-ATUAL.md <<FIM
          # PREVIEW ONLINE — MCI Platform

          | | |
          |---|---|
          | **PREVIEW URL** | ${URL_WEB} |
          | **API URL** | ${URL_API} |
          | **BRANCH** | ${GITHUB_REF_NAME} |
          | **SHA** | ${SHA_PUBLICADO} |
          | **AMBIENTE** | QA/PREVIEW |
          | **VERIFICAÇÃO** | ${{ steps.verificacao.outcome }} |
          | **Subiu em** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | **Vive por** | ${MINUTOS_NO_AR} minutos |
          | **Expira em** | ${EXPIRA_UTC} · ${EXPIRA_BR} (Brasília) |
          | **Verificação do cadastro** | ${{ steps.verificacao_cadastro.outcome }} |
          | **Execução** | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |

          ## Credenciais de QA

          | Papel | Usuário | Senha |
          |---|---|---|
          | Operador (direção de evento + gerência de ranking) | ${EMAIL_OPERADOR} | ${DEMO_PASSWORD} |
          | Atleta | ${EMAIL_ATLETA} | ${DEMO_PASSWORD} |

          ### Módulo Treinadores & Equipes

          | Perfil | Usuário | Senha |
          |---|---|---|
          | Administração Central | ${TREINADORES_EMAIL_CENTRAL} | ${DEMO_PASSWORD} |
          | Diretor de Federação | ${TREINADORES_EMAIL_DIRETOR} | ${DEMO_PASSWORD} |
          | Treinador (Equipe) — cadastro **aprovado**, atuação autorizada | ${TREINADORES_EMAIL_TREINADOR} | ${DEMO_PASSWORD} |
          | Treinador suspenso — para a central **reativar** | ${TREINADORES_EMAIL_SUSPENSO} | ${DEMO_PASSWORD} |
          | Atleta com **convite pendente** | ${TREINADORES_EMAIL_ATLETA} | ${DEMO_PASSWORD} |
          | Delegado central (delegação viva, com escopo e prazo) | ${TREINADORES_EMAIL_DELEGADO} | ${DEMO_PASSWORD} |

          Telas do módulo: \`/#/treinador\` · \`/#/minha-equipe\` ·
          \`/#/admin/treinadores\` · \`/#/admin/auditoria\`

          Federação: **Federação QA Treinadores** · Equipe: **Equipe QA Alfa**

          Ambiente **público e efêmero**, com dados **fictícios**. Nenhuma destas
          contas existe em produção, e nenhuma senha de produção foi usada.
          Não insira dado real aqui.

          **Quando expirar**, o túnel morre junto com a execução e a tela passa a
          dizer "Não foi possível conectar à API." — não é defeito do sistema, é a
          janela fechada. Para levantar outro: Actions › Preview QA › Run workflow.
          FIM

          # Um clone à parte, e não a árvore de trabalho: a API e o servidor
          # estático estão rodando de dentro dela, e trocar de branch debaixo de
          # processos vivos é pedir para o preview cair no momento em que ele
          # deveria ser anunciado.
          #
          # A publicação é por git, e não pela API de conteúdo: a API exige que
          # o branch já exista, e criar a ref antes foi o que falhou na execução
          # anterior — "Branch preview-estado not found".
          git clone --quiet --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/estado
          cd /tmp/estado
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Branch órfão, recriado a cada execução: é QUADRO DE AVISO, não
          # histórico. Nada aqui entra no branch de trabalho nem na main.
          git switch --orphan preview-estado
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/PREVIEW-ATUAL.md PREVIEW-ATUAL.md
          git add PREVIEW-ATUAL.md
          git commit --quiet -m "preview no ar — ${SHA_CURTO}"
          git push --quiet --force origin preview-estado

          echo "estado publicado em preview-estado/PREVIEW-ATUAL.md"

      # O QUE SE VIGIA É O TÚNEL, e não só a API local.
      #
      # Este laço conferia `http://127.0.0.1/health` a cada cinco minutos. A API
      # local pode estar perfeita enquanto o túnel da Cloudflare — que é por onde
      # a pessoa entra — está morto: nesse estado o job imprimia "no ar" por
      # horas e quem tentava usar recebia falha de rede. Túnel rápido cai sozinho,
      # e o laço não tinha como saber.
      #
      # Agora as duas URLs PÚBLICAS são conferidas a cada minuto. Três falhas
      # seguidas encerram a execução com diagnóstico, em vez de anunciar um
      # ambiente que não responde: uma piscada de rede não derruba um preview
      # bom, e um túnel morto para de ser silencioso.
      - name: Manter o ambiente no ar
        run: |
          fim=$(( $(date +%s) + MINUTOS_NO_AR * 60 ))
          seguidas=0
          minuto=0
          while [ "$(date +%s)" -lt "$fim" ]; do
            if ! curl -fsS --max-time 10 "http://127.0.0.1:${PORTA_API}/health" >/dev/null 2>&1; then
              echo "a API local caiu; últimas linhas do log:"
              tail -40 /tmp/api.log
              exit 1
            fi

            ruim=""
            for alvo in "${URL_API}/health" "${URL_WEB}/"; do
              curl -fsS --max-time 15 "$alvo" >/dev/null 2>&1 || ruim="${ruim} ${alvo}"
            done

            if [ -n "$ruim" ]; then
              seguidas=$(( seguidas + 1 ))
              echo "sem resposta pública (${seguidas}/3):${ruim}"
              if [ "$seguidas" -ge 3 ]; then
                echo "o túnel parou de responder três vezes seguidas — encerrando para não anunciar ambiente morto."
                echo '--- tunel api ---'; tail -40 /tmp/tunel-api.log 2>/dev/null || true
                echo '--- tunel web ---'; tail -40 /tmp/tunel-web.log 2>/dev/null || true
                exit 1
              fi
            else
              seguidas=0
              if [ $(( minuto % 5 )) -eq 0 ]; then
                restam=$(( (fim - $(date +%s)) / 60 ))
                echo "no ar — ${URL_WEB} — restam ${restam} min"
              fi
            fi

            minuto=$(( minuto + 1 ))
            sleep 60
          done
          echo "janela encerrada."

      - name: Diagnóstico quando algo falha
        if: failure()
        run: |
          echo '--- api ---'; tail -80 /tmp/api.log 2>/dev/null || true
          echo '--- web ---'; tail -40 /tmp/web.log 2>/dev/null || true
          echo '--- tunel api ---'; tail -40 /tmp/tunel-api.log 2>/dev/null || true
          echo '--- tunel web ---'; tail -40 /tmp/tunel-web.log 2>/dev/null || true
