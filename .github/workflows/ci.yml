name: CI

# Valida cada push e cada PR. Não publica nada: deploy é decisão manual.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — validação e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # PostgreSQL de verdade, na mesma versão da produção. Um banco em memória
    # ou um SQLite "parecido" deixaria passar exatamente o que interessa pegar:
    # diferença de dialeto, de tipo e de sensibilidade a maiúsculas.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mci
          POSTGRES_PASSWORD: mci
          POSTGRES_DB: mci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mci -d mci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mci:mci@localhost:5432/mci_test?schema=public
      STORAGE_DIR: ./uploads-test
      JWT_SECRET: ci-secret-apenas-para-a-pipeline-com-tamanho-suficiente
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar schema do Prisma
        run: npx prisma validate

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Verificar sintaxe do servidor
        run: |
          node --check server.js
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Aplicar migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Conferir que nenhuma migration ficou pendente
        run: npx prisma migrate status

      - name: Testes do backend
        run: npx vitest run

  frontend:
    name: Frontend — testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes da interface
        run: npm test -- --run

      - name: Build de produção
        run: npm run build

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t mci-platform:ci .

      # Construir não prova que arranca. Aqui a imagem sobe de verdade contra um
      # PostgreSQL, aplica as migrations e precisa responder /health e /ready —
      # que é o que o orquestrador vai perguntar antes de mandar tráfego.
      - name: Subir a pilha e conferir as sondas
        run: |
          docker network create mci-ci
          docker run -d --name pg --network mci-ci             -e POSTGRES_USER=mci -e POSTGRES_PASSWORD=mci -e POSTGRES_DB=mci             postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U mci -d mci && break
            sleep 2
          done
          docker run -d --name api --network mci-ci -p 3000:3000             -e NODE_ENV=production             -e DATABASE_URL='postgresql://mci:mci@pg:5432/mci?schema=public'             -e JWT_SECRET=segredo-de-ci-com-mais-de-trinta-e-dois-caracteres             -e CORS_ORIGINS=http://localhost:3000             -e PAYMENT_WEBHOOK_SECRET=segredo-de-webhook-da-ci             -e ALLOW_SANDBOX_PAYMENTS=true             mci-platform:ci sh -c "npx prisma migrate deploy && node server.js"

          pronto=0
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/health > /dev/null; then pronto=1; break; fi
            sleep 3
          done
          if [ "$pronto" != "1" ]; then
            echo "A imagem não respondeu /health. Log do container:"
            docker logs api
            exit 1
          fi

          echo "--- /health ---"; curl -s http://localhost:3000/health; echo
          echo "--- /ready ---";  curl -s http://localhost:3000/ready;  echo
          curl -sf http://localhost:3000/ready | grep -q '"status":"ready"' || {
            echo "A instância subiu mas não se declarou pronta."; docker logs api; exit 1; }

          echo "--- a interface é servida pela própria API? ---"
          curl -sf http://localhost:3000/ | grep -qi "MCI Campeonatos" || {
            echo "A raiz não devolveu a interface construída."; exit 1; }
          echo "sim"

      - name: Encerrar
        if: always()
        run: docker rm -f api pg 2>/dev/null || true

  higiene:
    name: Higiene do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Nenhum segredo real versionado
        run: |
          set +e
          # Comprimento realista de propósito: 'sk_live_x' num teste de redação
          # não é credencial, e um padrão que o acusa vira ruído que se aprende
          # a ignorar. tests/ continua no escopo para não criar ponto cego.
          PADRAO='sk_live_[A-Za-z0-9]{20,}|pk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{20,}'
          ENCONTRADO=$(git ls-files | grep -vE 'package-lock|design/|\.github/' | xargs grep -lnE "$PADRAO" 2>/dev/null)
          if [ -n "$ENCONTRADO" ]; then
            echo "Segredo encontrado nos arquivos versionados:"
            echo "$ENCONTRADO"
            exit 1
          fi
          echo "Nenhum segredo real versionado."

      - name: Nenhum .env versionado
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo ".env não pode ser versionado."
            exit 1
          fi
          echo ".env fora do versionamento."

      - name: Sem marcador de trabalho inacabado no código
        run: |
          set +e
          ENCONTRADO=$(grep -rnE 'console\.log\(|debugger;|TODO:|FIXME:' src frontend/src tests 2>/dev/null)
          if [ -n "$ENCONTRADO" ]; then
            echo "Marcadores encontrados:"
            echo "$ENCONTRADO"
            exit 1
          fi
          echo "Nenhum marcador de trabalho inacabado."

      - name: Whitespace limpo
        run: git diff --check HEAD~1 HEAD || true
