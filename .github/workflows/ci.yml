name: CI

# Valida cada push e cada PR. Não publica nada: deploy é decisão manual.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migrations, RLS e testes
    runs-on: ubuntu-latest
    # TETO SUBIU DE 25 PARA 40, E O MOTIVO NÃO É A SUÍTE TER FICADO LENTA.
    #
    # A execução #233 foi CANCELADA aos 24m23s no passo de testes: nenhum teste
    # falhou, o job foi cortado — e com ele os dois passos que conferem que
    # backup/restore e BYPASSRLS não pularam, que rodam depois.
    #
    # Antes de subir o teto, o custo foi medido em vez de presumido. A suspeita
    # natural era a política nova de escrita do AuditLog, que avalia até três
    # subconsultas por INSERT: 400 escritas levaram 489ms, ou 1,22ms cada. A
    # suíte inteira faz cerca de mil escritas de auditoria — algo em torno de
    # 1,2 segundo no total. Não é isso.
    #
    # O que é: este job JÁ VARIOU de 7m36s a 24m29s no mesmo código, e está
    # registrado em fases anteriores. A suíte cresceu 9% (799s para 871s
    # medidos localmente), o suficiente para um runner lento cruzar os 25.
    #
    # 40 dá folga real sem esconder travamento: o dobro do tempo local, e ainda
    # bem abaixo do ponto em que um job pendurado passaria despercebido.
    timeout-minutes: 40

    # A suíte exige PostgreSQL de verdade: o RLS é testado executando as
    # políticas, não lendo o SQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mci
          POSTGRES_PASSWORD: mci_ci
          POSTGRES_DB: mci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mci -d mci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      # NÃO é o usuário de bootstrap do contêiner: aquele é superusuário, e
      # superusuário ignora RLS. Ver o passo que cria este papel.
      DATABASE_URL: postgresql://mci_owner:mci_owner_ci@localhost:5432/mci_test?schema=public
      RLS_DATABASE_URL: postgresql://mci_app:mci_app_ci@localhost:5432/mci_test?schema=public
      # Papel de leitura do backup. Sem ele definido, a suíte de
      # backup/restore se declara "skipped" e a pipeline fica verde sem ter
      # exercitado o procedimento de recuperação — exatamente o buraco que a
      # FASE 12.3 encontrou.
      BACKUP_DATABASE_URL: postgresql://mci_backup:mci_backup_ci@localhost:5432/mci_test?schema=public
      STORAGE_DIR: ./uploads-test
      JWT_SECRET: ci-secret-apenas-para-a-pipeline-com-tamanho-suficiente
      BCRYPT_ROUNDS: '4'
      LOG_LEVEL: silent
      # Senha EFÊMERA de papel de TESTE, num banco de descarte que morre com o
      # job. Não é segredo: está aqui, à vista, pelo mesmo motivo que as
      # outras senhas desta pipeline — para que o arquivo descreva por inteiro
      # o ambiente que ele monta.
      BYPASSRLS_TEST_PASSWORD: teste_bypassrls_efemero

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O POSTGRES_USER da imagem oficial é o usuário de bootstrap e nasce
      # SUPERUSUÁRIO — e superusuário ignora RLS incondicionalmente, mesmo com
      # FORCE. Rodar a suíte com ele deixaria a barreira sem efeito e a CI
      # verde justamente no cenário que ela precisa reprovar.
      #
      # Rebaixá-lo não é possível: o PostgreSQL recusa remover SUPERUSER do
      # usuário de bootstrap. Então a aplicação recebe um papel próprio, comum,
      # que passa a ser dono do schema e das tabelas.
      - name: Criar o papel dono do schema, sem superusuário
        env:
          PGPASSWORD: mci_ci
        run: |
          set -e
          PSQL="psql -h localhost -U mci -d mci_test -v ON_ERROR_STOP=1"
          $PSQL -c "CREATE ROLE mci_owner LOGIN PASSWORD 'mci_owner_ci' NOSUPERUSER CREATEROLE"
          $PSQL -c "GRANT ALL ON DATABASE mci_test TO mci_owner"
          $PSQL -c "ALTER SCHEMA public OWNER TO mci_owner"
          # Falha alto se o papel sair superusuário: sem isto, a suíte inteira
          # rodaria sem RLS e mesmo assim ficaria verde.
          #
          # Bloco DO, e não CASE ... THEN 1/0: o PostgreSQL dobra subexpressão
          # constante em tempo de planejamento, então a divisão estoura mesmo
          # no ramo que não é tomado. A primeira versão desta guarda reprovava
          # sempre — inclusive num ambiente correto.
          PGPASSWORD=mci_owner_ci psql -h localhost -U mci_owner -d mci_test -v ON_ERROR_STOP=1 -qc \
            "DO \$\$ BEGIN IF current_setting('is_superuser') = 'on' THEN RAISE EXCEPTION 'papel da aplicacao e superusuario: o RLS nao teria efeito nenhum'; END IF; END \$\$"
          echo "mci_owner criado sem superusuário."

          # O POSTGRES PARA DE GRITAR O QUE OS TESTES ESPERAM OUVIR.
          #
          # Os testes de forja provam que a política RECUSA a escrita — e cada
          # recusa vira ERROR + STATEMENT no log do container. São dezenas de
          # milhares de linhas de ruído ESPERADO, e o runner despeja tudo isso
          # no fim do log do job.
          #
          # O efeito prático não é estético: a API de logs entrega cerca de
          # 1 MB a partir do fim, e só o despejo passa disso. Quando a suíte
          # reprova, o resumo do vitest fica inalcançável — aconteceu em cinco
          # execuções seguidas, todas vermelhas e nenhuma legível.
          #
          # Nada de diagnóstico se perde: quem reporta falha de banco são os
          # próprios testes, com a mensagem do PostgreSQL dentro do erro. O que
          # se cala aqui é a cópia dessa mesma mensagem no log do container.
          $PSQL -c "ALTER SYSTEM SET log_min_messages = 'fatal'"
          $PSQL -c "ALTER SYSTEM SET log_min_error_statement = 'fatal'"
          $PSQL -c "SELECT pg_reload_conf()"


      - name: Validar schema do Prisma
        run: npx prisma validate

      - name: Gerar Prisma Client
        run: npx prisma generate

      # O projeto é JavaScript puro: não há etapa de typecheck porque não há
      # tipos para checar. As duas validações estáticas reais são estas — a
      # sintaxe, que pega arquivo que nem carrega, e o ESLint, que pega defeito.
      # Nenhuma delas é decorativa: ambas reprovam o job.
      - name: Verificar sintaxe
        run: |
          node --check server.js
          find src prisma scripts -name "*.js" -print0 | xargs -0 -n1 node --check

      # A configuração na raiz cobre backend, scripts, testes e frontend/src.
      - name: ESLint
        run: npx eslint .

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Conferir que nenhuma migration ficou pendente
        run: npx prisma migrate status

      - name: Provisionar o papel de aplicação usado nos testes de RLS
        env:
          PGPASSWORD: mci_owner_ci
        run: |
          # A criação do papel exige CREATEROLE. Em produção o usuário de
          # migration não deve tê-lo, e o provisionamento é passo separado com
          # um papel administrativo (ver docs/DEPLOY.md); aqui `mci_owner` o
          # recebe para que a pipeline se baste.
          psql -h localhost -U mci_owner -d mci_test -v senha="'mci_app_ci'" -f scripts/provision-app-role.sql

      # BYPASSRLS só é concedível por papel administrativo; aqui é o usuário de
      # bootstrap que concede, como em produção seria o DBA. O papel resultante
      # é somente-leitura e existe porque, sob FORCE ROW LEVEL SECURITY, o dono
      # do schema NÃO consegue rodar pg_dump.
      - name: Provisionar o papel de backup
        env:
          PGPASSWORD: mci_ci
        run: |
          psql -h localhost -U mci -d mci_test -v ON_ERROR_STOP=1 \
               -v DBNAME=mci_test -v senha="'mci_backup_ci'" \
               -f scripts/provision-backup-role.sql
          # O papel de backup precisa poder criar o banco de destino do ensaio
          # de restauração.
          psql -h localhost -U mci -d mci_test -v ON_ERROR_STOP=1 \
               -c "ALTER ROLE mci_owner CREATEDB"

      # OS PAPÉIS DO TESTE DE BYPASSRLS SÃO PROVISIONADOS POR QUEM PODE.
      #
      # O teste criava o papel sozinho e a CI reprovava: conceder BYPASSRLS
      # exige já tê-lo, e `mci_owner` não tem — nem pode ter, porque é o papel
      # da aplicação. Aqui quem cria é o usuário de bootstrap, exatamente como
      # em produção seria o DBA, e o teste apenas se conecta por eles.
      - name: Provisionar os papéis do teste de BYPASSRLS
        env:
          PGPASSWORD: mci_ci
        run: |
          psql -h localhost -U mci -d mci_test -v ON_ERROR_STOP=1 \
               -v senha="'${BYPASSRLS_TEST_PASSWORD}'" \
               -f scripts/provision-bypassrls-test-roles.sql

      - name: Popular o catálogo oficial
        run: node prisma/seed.js

      - name: Testes do backend
        # A SAÍDA VAI PARA ARQUIVO, E NÃO SÓ PARA O LOG DO JOB.
        #
        # O log deste job termina com o despejo do container do Postgres, que
        # nesta suíte tem centenas de milhares de linhas: cada recusa de RLS
        # dos testes de forja vira ERROR + STATEMENT. É ruído ESPERADO — são
        # testes provando que a política recusa —, mas ele empurra a saída do
        # vitest para tão longe do fim que, quando a suíte reprova, o motivo
        # fica ilegível: só se alcança o despejo, nunca o resumo.
        #
        # Aconteceu de verdade: quatro execuções seguidas vermelhas e nenhuma
        # delas dizendo qual teste caiu. `pipefail` preserva o código de saída
        # do vitest através do `tee`.
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee /tmp/testes-do-backend.log

      # Só quando reprova, e primeiro no log: o resumo do vitest, longe do
      # despejo do container.
      - name: Que teste caiu
        if: failure()
        run: |
          echo "───── resumo do vitest ─────"
          grep -E "FAIL|×|Test Files|Tests  " /tmp/testes-do-backend.log | tail -60 || true

      - name: Guardar a saída completa dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saida-dos-testes-do-backend
          path: /tmp/testes-do-backend.log
          retention-days: 7

      # Uma suíte que pula silenciosamente é uma suíte que não existe. Este
      # passo reprova se os testes de backup/restore não tiverem rodado.
      - name: Conferir que o ensaio de backup/restore não foi pulado
        run: |
          set -e
          SAIDA=$(npx vitest run tests/backup-restore.test.mjs tests/backup-storage.test.mjs --reporter=json 2>/dev/null | tail -1)
          PULADOS=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPendingTests+r.numTodoTests)" <<< "$SAIDA")
          PASSOU=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPassedTests)" <<< "$SAIDA")
          echo "backup/restore (banco e storage): $PASSOU passaram, $PULADOS pulados"
          # 5 do banco + 6 do storage. Recuperar só o banco é meia recuperação:
          # o dump não guarda arquivo algum.
          if [ "$PULADOS" != "0" ] || [ "$PASSOU" -lt 11 ]; then
            echo "O ensaio de backup/restore não rodou por inteiro."
            exit 1
          fi

      # O MESMO CUIDADO PARA O ÚNICO TESTE QUE SÓ RODA AQUI.
      #
      # `bypassrls-real` cria um papel com BYPASSRLS, conecta por ele e mede
      # duas coisas: que o atributo DERRUBA FORCE ROW LEVEL SECURITY, e que a
      # barreira de partida recusa essa conexão. Ele exige CREATEROLE, que só
      # existe nesta pipeline — no ambiente de desenvolvimento ele pula, e
      # pular é o comportamento correto lá.
      #
      # Aqui, pular seria perder a única prova de que o perigo é real. Este
      # passo reprova se isso acontecer.
      - name: Conferir que o teste real de BYPASSRLS não foi pulado
        run: |
          set -e
          SAIDA=$(npx vitest run tests/bypassrls-real.test.mjs --reporter=json 2>/dev/null | tail -1)
          PULADOS=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPendingTests+r.numTodoTests)" <<< "$SAIDA")
          PASSOU=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPassedTests)" <<< "$SAIDA")
          echo "bypassrls real: $PASSOU passaram, $PULADOS pulados"
          # 5 do papel com BYPASSRLS + 1 do papel de backup.
          if [ "$PULADOS" != "0" ] || [ "$PASSOU" -lt 6 ]; then
            echo "O teste real de BYPASSRLS não rodou. Sem ele, a barreira está afirmada e não medida."
            exit 1
          fi

      # A MESMA GUARDA PARA A TAXONOMIA DE CATEGORIA E CLASSE.
      #
      # `taxonomia-de-classe` é a suíte que prova que "Women's Physique -
      # Masters 35+" vira categoria MAIS classe, que as quatro classes
      # genéricas continuam intactas, que as duas regras de unicidade existem
      # NO BANCO — índice parcial não é expresso pelo Prisma e some no
      # primeiro `db push` — e que nada disso moveu a pontuação.
      #
      # Ela depende de estado do banco. Pulá-la em silêncio devolveria um CI
      # verde sobre um recorte que não funciona mais.
      - name: Conferir que as suítes de taxonomia e de ajuste não foram puladas
        run: |
          set -e
          SAIDA=$(npx vitest run tests/taxonomia-de-classe.test.mjs tests/diagnostico-classe.test.mjs tests/ajuste-de-pontos.test.mjs tests/temporada-sem-tabela-de-pontos.test.mjs --reporter=json 2>/dev/null | tail -1)
          PULADOS=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPendingTests+r.numTodoTests)" <<< "$SAIDA")
          PASSOU=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPassedTests)" <<< "$SAIDA")
          echo "taxonomia, ajuste e diagnóstico: $PASSOU passaram, $PULADOS pulados"
          # 16 da taxonomia + 6 do diagnóstico somente-leitura + 16 do ajuste
          # administrativo + 4 da temporada sem tabela de pontos.
          if [ "$PULADOS" != "0" ] || [ "$PASSOU" -lt 42 ]; then
            echo "A suíte da taxonomia/ajuste não rodou por inteiro."
            exit 1
          fi

      # A MESMA GUARDA PARA O CATÁLOGO OFICIAL DE CATEGORIAS.
      #
      # Esta é a suíte que reproduz o defeito que chegou à base real da
      # federação: catálogo de categorias VAZIO mais base de atletas VAZIA,
      # juntos. `Category` nasceu vazia em produção porque `render.yaml` roda
      # `prisma migrate deploy` e nunca rodou o seed, e a guarda que recusaria
      # categoria desconhecida ficava depois da resolução do atleta — que
      # também não resolvia. Resultado: 191 linhas aplicadas com "0 conflitos"
      # e `categoryId` nulo nas 191.
      #
      # Um deles é o teste que apaga `Category` de propósito. Se ele for
      # pulado, o CI fica verde exatamente sobre o buraco que abriu isto.
      - name: Conferir que a suíte do catálogo de categorias não foi pulada
        run: |
          set -e
          SAIDA=$(npx vitest run tests/catalogo-oficial-de-categorias.test.mjs tests/backfill-classe.test.mjs --reporter=json 2>/dev/null | tail -1)
          PULADOS=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPendingTests+r.numTodoTests)" <<< "$SAIDA")
          PASSOU=$(node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(r.numPassedTests)" <<< "$SAIDA")
          echo "catálogo de categorias e backfill: $PASSOU passaram, $PULADOS pulados"
          # 8 do catálogo oficial + 14 do backfill da classe.
          if [ "$PULADOS" != "0" ] || [ "$PASSOU" -lt 22 ]; then
            echo "A suíte do catálogo de categorias não rodou por inteiro."
            exit 1
          fi

      # O catálogo precisa terminar o job do jeito que o deploy o entrega: a
      # suíte acima apaga `Category` de propósito num dos testes e reprovisiona
      # em seguida. Conferir aqui custa um comando e fecha a janela.
      - name: Conferir que o catálogo terminou provisionado
        run: |
          set -e
          node -e "const p=require('./src/config/prisma');p.category.count().then(n=>{console.log('categorias:',n);if(n<11){console.error('O catálogo oficial não está completo ao fim do job.');process.exit(1)}process.exit(0)})"

  frontend:
    name: Frontend — testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes da interface
        run: npm test -- --run

      - name: Build de produção
        run: npm run build

  higiene:
    name: Higiene do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Nenhum segredo real versionado
        run: |
          set +e
          # Comprimento realista de propósito: 'sk_live_x' num teste de redação
          # não é credencial, e um padrão que o acusa vira ruído que se aprende
          # a ignorar.
          PADRAO='sk_live_[A-Za-z0-9]{20,}|pk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{20,}'
          ENCONTRADO=$(git ls-files | grep -vE 'package-lock|design/|\.github/' | xargs grep -lnE "$PADRAO" 2>/dev/null)
          if [ -n "$ENCONTRADO" ]; then
            echo "Segredo encontrado nos arquivos versionados:"
            echo "$ENCONTRADO"
            exit 1
          fi
          echo "Nenhum segredo real versionado."

      - name: Nenhum .env versionado
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo ".env não pode ser versionado."
            exit 1
          fi
          echo ".env fora do versionamento."

      - name: Sem marcador de trabalho inacabado no código
        run: |
          set +e
          ENCONTRADO=$(grep -rnE 'console\.log\(|debugger;|TODO:|FIXME:' src frontend/src tests 2>/dev/null)
          if [ -n "$ENCONTRADO" ]; then
            echo "Marcadores encontrados:"
            echo "$ENCONTRADO"
            exit 1
          fi
          echo "Nenhum marcador de trabalho inacabado."

      - name: Nenhum módulo financeiro no repositório
        run: |
          set +e
          # A ausência de camada financeira é requisito do produto. A suíte já
          # verifica schema, banco e rotas; aqui a checagem é de nome de
          # arquivo, para pegar um módulo reintroduzido antes de ele ser
          # ligado em qualquer lugar.
          ENCONTRADO=$(git ls-files 'src/**' 'frontend/src/**' | grep -iE '(payment|checkout|coupon|refund|invoice|billing|wallet)')
          if [ -n "$ENCONTRADO" ]; then
            echo "Arquivo financeiro encontrado:"
            echo "$ENCONTRADO"
            exit 1
          fi
          echo "Nenhum módulo financeiro."
