# ============================================================================
# SONDA DE PRODUÇÃO — /health e /ready, somente leitura
#
# POR QUE ESTE WORKFLOW EXISTE
#
# A rede onde o agente trabalha não alcança o Render: o CONNECT para
# `*.onrender.com` volta 403 por política de egresso da organização. O runner
# do Actions tem internet. Ele é o único lugar de onde este projeto consegue
# PERGUNTAR à produção se ela está de pé — o mesmo motivo que fez o
# `preview.yml` nascer aqui.
#
# O QUE ELE FAZ
#
#   dois GET. `/health` e `/ready`. Mais nada.
#
# O QUE ELE NÃO FAZ
#
#   não escreve, não autentica, não usa credencial nenhuma, não toca no banco,
#   não faz deploy e não roda em push. Só quando alguém pede.
#
# SOBRE O LOG SER PÚBLICO
#
# O repositório é público, e log de Actions de repositório público é público.
# Isto aqui é seguro porque `/health` e `/ready` JÁ SÃO públicos — qualquer
# pessoa na internet pode chamá-los — e porque `healthService.js` foi escrito
# para não publicar segredo em nenhum dos dois: o diagnóstico de armazenamento
# sai como status HTTP e código do serviço, nunca o corpo bruto, justamente
# porque erro de credencial em S3 devolve a Access Key dentro do XML.
# ============================================================================

name: Sonda de produção

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'URL da API, sem barra no final'
        required: false
        default: 'https://mci-platform-api.onrender.com'

permissions:
  contents: read

jobs:
  sondar:
    name: /health e /ready
    runs-on: ubuntu-latest
    steps:
      - name: Conferir que o host existe
        id: dns
        run: |
          API="${{ inputs.api }}"
          HOST="$(printf '%s' "$API" | sed -E 's#^https?://##; s#/.*$##')"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Host: $HOST"
          if getent hosts "$HOST" > /dev/null; then
            echo "DNS resolve."
          else
            echo "::error::O host \`$HOST\` não resolve. Isto não é a produção caída: é a URL errada. Confira o nome real do serviço no painel do Render — ele sufixa o nome com caracteres aleatórios (ver docs/DEPLOY-RENDER.md)."
            exit 1
          fi

      # O plano free do Render hiberna o serviço. A primeira chamada depois da
      # hibernação demora para responder, e um timeout curto mediria a
      # hibernação, não a saúde. Daí o tempo largo.
      - name: GET /health
        id: health
        run: |
          API="${{ inputs.api }}"
          CODIGO="$(curl -sS -m 120 -o /tmp/health.json -w '%{http_code}' "$API/health" || echo 000)"
          echo "HTTP $CODIGO"
          echo '--- corpo ---'
          cat /tmp/health.json; echo
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          [ "$CODIGO" = "200" ] || { echo "::error::/health respondeu $CODIGO, e o esperado é 200."; exit 1; }

      # /ready responde 503 quando o banco, o armazenamento ou o RLS reprovam.
      # 503 é uma MEDIÇÃO VÁLIDA, não um erro da sonda: o corpo diz qual dos
      # três caiu. Por isso o passo não morre em 503 — ele mostra o corpo e
      # falha depois, com o diagnóstico já impresso.
      - name: GET /ready
        id: ready
        run: |
          API="${{ inputs.api }}"
          CODIGO="$(curl -sS -m 120 -o /tmp/ready.json -w '%{http_code}' "$API/ready" || echo 000)"
          echo "HTTP $CODIGO"
          echo '--- corpo ---'
          cat /tmp/ready.json; echo
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      - name: Resumo
        if: always()
        run: |
          {
            echo '## Sonda de produção'
            echo
            echo "Host: \`${{ steps.dns.outputs.host }}\`"
            echo
            echo '| Sonda | HTTP |'
            echo '|---|---|'
            echo "| \`/health\` | ${{ steps.health.outputs.codigo || 'não chegou a rodar' }} |"
            echo "| \`/ready\` | ${{ steps.ready.outputs.codigo || 'não chegou a rodar' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: O veredito
        run: |
          C="${{ steps.ready.outputs.codigo }}"
          case "$C" in
            200) echo "PASS — a produção está pronta para receber tráfego." ;;
            503) echo "::error::FAIL — /ready respondeu 503. O corpo acima diz qual das três conferências (database, storage, rls) reprovou. A aplicação recusar tráfego sem RLS efetivo é comportamento desejado, não defeito: ver docs/DEPLOY.md."; exit 1 ;;
            *)   echo "::error::FAIL — /ready respondeu $C."; exit 1 ;;
          esac

  # ==========================================================================
  # §18 — SMOKE TEST PÓS-DEPLOY, SOMENTE LEITURA
  #
  # Só roda se `/ready` passou: sondar produção que já se declarou fora do ar
  # mede a indisponibilidade, não o sistema.
  #
  # TUDO AQUI É GET, E TUDO ANÔNIMO. Nenhuma escrita, nenhum token, nenhuma
  # credencial. Nada é criado e nada é apagado.
  #
  # POR QUE NENHUM CORPO É IMPRESSO
  #
  # O log é público. `/events`, `/ranking` e `/search` devolvem NOMES DE
  # ATLETAS REAIS — dado público na aplicação, mas despejá-lo num log de CI é
  # publicá-lo de novo, num lugar onde ninguém foi avisado que ele estaria.
  # Então o que sai daqui é contagem e veredito. A conferência de CPF, pelo
  # mesmo motivo, imprime QUANTAS ocorrências achou e nunca o que achou: um
  # CPF impresso aqui seria justamente o vazamento que a sonda existe para
  # recusar.
  # ==========================================================================
  smoke:
    name: §18 — smoke test somente leitura
    needs: sondar
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api || 'https://mci-platform-api.onrender.com' }}
    steps:
      - name: Preparar o placar
        run: |
          echo "FALHAS=0" >> "$GITHUB_ENV"
          echo '| Sonda | Esperado | Obtido | |' >> /tmp/placar.md
          echo '|---|---|---|---|' >> /tmp/placar.md

      # ------------------------------------------------------------- leitura
      - name: Os campeonatos continuam publicados
        run: |
          C="$(curl -sS -m 120 -o /tmp/ev.json -w '%{http_code}' "$API/api/v1/events?limit=100")"
          N="$(jq -r '.items | length' /tmp/ev.json 2>/dev/null || echo erro)"
          echo "HTTP $C — $N campeonatos na vista pública"
          # A vista anônima esconde DRAFT e CANCELLED, então 47 é o total do
          # banco e não necessariamente o total daqui. Por isso a contagem é
          # RELATADA; o que reprova é a lista vazia.
          if [ "$C" = "200" ] && [ "$N" -gt 0 ] 2>/dev/null; then
            echo "| \`GET /events\` | 200, lista não vazia | 200, $N itens | PASS |" >> /tmp/placar.md
          else
            echo "| \`GET /events\` | 200, lista não vazia | HTTP $C, $N | **FAIL** |" >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi
          echo "EVENTOS=$N" >> "$GITHUB_ENV"

      - name: O ranking público responde
        run: |
          C="$(curl -sS -m 120 -o /tmp/rk.json -w '%{http_code}' "$API/api/v1/ranking/super-overall")"
          N="$(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/rk.json 2>/dev/null || echo erro)"
          echo "HTTP $C — $N linhas no Super Overall"
          if [ "$C" = "200" ]; then
            echo "| \`GET /ranking/super-overall\` | 200, JSON válido | 200, $N linhas | PASS |" >> /tmp/placar.md
          else
            echo "| \`GET /ranking/super-overall\` | 200 | HTTP $C | **FAIL** |" >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------- autorização
      - name: Sem token, a lista de atletas recusa
        run: |
          C="$(curl -sS -m 120 -o /dev/null -w '%{http_code}' "$API/api/v1/athletes")"
          echo "HTTP $C"
          if [ "$C" = "401" ]; then
            echo '| `GET /athletes` sem token | 401 | 401 | PASS |' >> /tmp/placar.md
          else
            echo "| \`GET /athletes\` sem token | 401 | **$C** | **FAIL** |" >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi

      # Um id que não é de ninguém, sem token. O que se mede é a ORDEM das
      # barreiras: autenticação ANTES de existência. Um 404 aqui já contaria
      # quem existe e quem não existe para quem não se identificou.
      - name: Sem token, o perfil de um atleta recusa antes de dizer se existe
        run: |
          C="$(curl -sS -m 120 -o /dev/null -w '%{http_code}' "$API/api/v1/athletes/00000000-0000-4000-8000-000000000000")"
          echo "HTTP $C"
          if [ "$C" = "401" ]; then
            echo '| `GET /athletes/:id` sem token | 401 (não 404) | 401 | PASS |' >> /tmp/placar.md
          else
            echo "| \`GET /athletes/:id\` sem token | 401 (não 404) | **$C** | **FAIL** |" >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------------ CPF
      # A regra é absoluta: CPF NUNCA aparece em busca pública, nem mascarado.
      - name: Nenhum CPF na busca pública
        run: |
          FALHOU=0
          for TERMO in 'si' 'da' '00000000191'; do
            C="$(curl -sS -m 120 -o /tmp/busca.json -w '%{http_code}' --get --data-urlencode "q=$TERMO" "$API/api/v1/search")"
            # Três formas de o número escapar: a chave, o formato pontuado e
            # onze dígitos soltos. O que sai no log é a CONTAGEM — imprimir a
            # ocorrência seria publicar o CPF que a sonda veio recusar.
            CHAVE="$(grep -oE '"cpf"' /tmp/busca.json | wc -l)"
            PONTUADO="$(grep -oE '[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}' /tmp/busca.json | wc -l)"
            # O termo volta ecoado em `.query`; descontá-lo evita acusar a
            # sonda de vazar a própria pergunta.
            SOLTOS="$(jq -r '.results' /tmp/busca.json 2>/dev/null | grep -oE '[0-9]{11}' | wc -l)"
            echo "q=$TERMO → HTTP $C · chave \"cpf\": $CHAVE · pontuado: $PONTUADO · 11 dígitos nos resultados: $SOLTOS"
            [ "$C" = "200" ] || FALHOU=1
            [ "$CHAVE" = "0" ] && [ "$PONTUADO" = "0" ] && [ "$SOLTOS" = "0" ] || FALHOU=1
          done
          if [ "$FALHOU" = "0" ]; then
            echo '| `GET /search` × 3 termos | 200 e zero CPF | 200 e zero CPF | PASS |' >> /tmp/placar.md
          else
            echo '| `GET /search` × 3 termos | 200 e zero CPF | **ver log** | **FAIL** |' >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi

      # -------------------------------------------------------- não-financeiro
      # "Este aplicativo NÃO é um sistema financeiro." A higiene do repositório
      # já recusa o módulo no código; isto confere a mesma coisa no ar.
      - name: Nenhuma rota financeira no ar
        run: |
          ACHADAS=''
          for R in payments checkout billing invoices subscriptions wallet orders; do
            C="$(curl -sS -m 60 -o /dev/null -w '%{http_code}' "$API/api/v1/$R")"
            echo "/$R → $C"
            case "$C" in 404|405) ;; *) ACHADAS="$ACHADAS /$R($C)" ;; esac
          done
          if [ -z "$ACHADAS" ]; then
            echo '| 7 rotas financeiras | 404 | 404 | PASS |' >> /tmp/placar.md
          else
            echo "| 7 rotas financeiras | 404 | **$ACHADAS** | **FAIL** |" >> /tmp/placar.md
            echo "FALHAS=$((FALHAS+1))" >> "$GITHUB_ENV"
          fi

      # ------------------------------------------------------------- veredito
      - name: Nada foi escrito
        run: |
          echo "Este job fez apenas GET. Nenhum POST, PATCH, PUT ou DELETE."
          echo '| Escrita em produção | nenhuma | nenhuma | PASS |' >> /tmp/placar.md

      - name: Placar
        if: always()
        run: |
          { echo '## §18 — smoke test somente leitura'; echo; cat /tmp/placar.md; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/placar.md

      - name: O veredito
        run: |
          echo "Campeonatos na vista pública: ${EVENTOS:-?}"
          if [ "${FALHAS:-0}" = "0" ]; then
            echo "PASS — §18 completo, sem falha."
          else
            echo "::error::FAIL — ${FALHAS} sonda(s) do §18 reprovaram. Ver o placar acima."
            exit 1
          fi

  # ==========================================================================
  # AS CINCO LINHAS DO SUPER OVERALL
  #
  # O §18 mediu 5 linhas e passou — ele cobra 200 com JSON válido. Mas 5 é
  # pouco para 47 campeonatos, e "é assim mesmo" só vale quando medido.
  #
  # O código diz que é o corte da vista pública: `TOP_PUBLICO = 5` em
  # rankingService.js. Este job confere que é ISSO que está acontecendo no ar,
  # e não uma tabela quase vazia que por acaso tem cinco linhas.
  #
  # A prova está no cabeçalho, não na contagem. `X-MCI-Public-View` só é
  # emitido quando o service MARCOU a lista como cortada — a marca vem do
  # motor, não de uma dedução pelo tamanho, justamente para que uma lista com
  # cinco linhas de fato não fosse rotulada como cortada.
  #
  # Tudo GET, tudo anônimo, nenhuma escrita.
  # ==========================================================================
  superoverall:
    name: As 5 linhas do Super Overall
    needs: sondar
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api || 'https://mci-platform-api.onrender.com' }}
    steps:
      - name: O corte é declarado no cabeçalho
        run: |
          curl -sS -m 120 -D /tmp/h.txt -o /tmp/so.json "$API/api/v1/ranking/super-overall" > /dev/null
          CORTE="$(grep -i '^x-mci-public-view:' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2-)"
          LIDAS="$(grep -i '^x-mci-rows-read:'   /tmp/h.txt | tr -d '\r' | cut -d' ' -f2-)"
          N="$(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/so.json)"
          echo "linhas no corpo ....... $N"
          echo "X-MCI-Public-View ..... ${CORTE:-(ausente)}"
          echo "X-MCI-Rows-Read ....... ${LIDAS:-(ausente)}"
          # Ausência de cabeçalho significa LISTA INTEIRA. Se as 5 linhas
          # viessem sem esta marca, aí sim seria notícia ruim: a temporada
          # inteira teria cinco competidores.
          if [ -z "$CORTE" ]; then
            echo "::error::As 5 linhas NÃO são corte de vista pública — o cabeçalho não veio, e ausência de cabeçalho quer dizer lista inteira. Isto seria uma temporada com 5 competidores, e não um teto."
            exit 1
          fi
          echo "CORTE=$CORTE" >> "$GITHUB_ENV"

      # Pedir mais não pode entregar mais. Se `limit=50` furasse o teto, o
      # corte seria decoração — bastaria pedir para ver a tabela inteira.
      - name: Pedir 50 continua entregando 5
        run: |
          N="$(curl -sS -m 120 "$API/api/v1/ranking/super-overall?limit=50" | jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end')"
          echo "com limit=50 → $N linhas"
          [ "$N" = "5" ] || { echo "::error::O teto público cedeu: limit=50 devolveu $N linhas."; exit 1; }

      # O mesmo teto vale para as outras tabelas anônimas? Se valesse só no
      # Super Overall, o "5" dele seria caso isolado e não regra.
      - name: O mesmo teto nas outras tabelas públicas
        run: |
          for R in 'ranking' 'ranking/teams' 'ranking/companies'; do
            curl -sS -m 120 -D /tmp/hh.txt -o /tmp/rr.json "$API/api/v1/$R" > /dev/null
            N="$(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/rr.json 2>/dev/null || echo '-')"
            H="$(grep -i '^x-mci-public-view:' /tmp/hh.txt | tr -d '\r' | cut -d' ' -f2-)"
            echo "/$R → $N linhas · corte: ${H:-(ausente)}"
          done

      # Contexto, não veredito: quantas temporadas existem e qual o calendário.
      # Nomes de temporada e códigos de classe não são dado pessoal.
      - name: O contexto — temporadas e classes elegíveis
        run: |
          curl -sS -m 120 -o /tmp/se.json "$API/api/v1/seasons"
          echo "temporadas: $(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/se.json)"
          jq -r 'if type=="array" then . elif .items then .items else [] end | .[] | "  · \(.name // .year // "?") — id \(.id[0:8])…"' /tmp/se.json 2>/dev/null || true
          echo
          curl -sS -m 120 -o /tmp/cl.json "$API/api/v1/ranking/classes"
          echo "classes no filtro do ranking: $(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/cl.json)"
          jq -r 'if type=="array" then . elif .items then .items else [] end | .[] | "  · \(.code // .name // "?")"' /tmp/cl.json 2>/dev/null | head -30 || true

      - name: Veredito
        run: |
          echo "As 5 linhas são o teto da vista pública, declarado em ${CORTE}."
          {
            echo '## As 5 linhas do Super Overall'
            echo
            echo "O corte é **declarado** no cabeçalho \`X-MCI-Public-View: ${CORTE}\`, pedir \`limit=50\`"
            echo 'continua entregando 5, e o mesmo teto vale para as outras tabelas anônimas.'
            echo 'Não é uma tabela vazia: é a regra da vista pública.'
            echo
            echo 'O total real da temporada só é visível a operador com vínculo na organização'
            echo 'dona dela — e esta sonda não usa credencial nenhuma.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # POR QUE OS RANKINGS DE EQUIPES E EMPRESAS ESTÃO VAZIOS
  #
  # A HIPÓTESE, LIDA NO CÓDIGO
  #
  # `teamRanking` filtra `PublicRankingEntry` por `teamId: { not: null }`. Essa
  # coluna espelha `RankingPoint.teamId`, e no caminho da importação o
  # `teamId` só nasce de duas formas (muscleWarService.js):
  #
  #   1. `equipeDeclarada` — o `teamName` do arquivo casado contra um `Team`
  #      QUE JÁ EXISTE. O importador nunca cria equipe: `equipes` vem de
  #      `prisma.team.findMany`, e nome que não casa vira `undefined`;
  #   2. o vínculo registrado do atleta (`AthleteTeamMembership`) — que exige
  #      `item.athleteId`, e resultado histórico importado não tem atleta
  #      cadastrado.
  #
  # Sem `Team` cadastrado, os dois caminhos dão nulo, e a tabela de equipes
  # fica vazia por falta de CADASTRO, não por falta de pontos. Para empresas a
  # cadeia é a mesma: `companyId` vem da empresa declarada casada contra
  # `Company` existente, ou da empresa DA EQUIPE — que não existe.
  #
  # O QUE ESTE JOB MEDE
  #
  # `/teams` e `/companies` exigem token, e esta sonda não usa credencial. Mas
  # a busca pública enxerga `Team` por nome (`searchService.TIPOS` inclui
  # `teams`, e a rota é anônima). Varrer bigramas comuns do português é o mais
  # perto de enumerar que dá sem credencial: um nome de equipe que exista
  # precisa conter pelo menos um deles.
  #
  # O CONTROLE É O QUE SEGURA A CONCLUSÃO: os mesmos termos contam EVENTOS.
  # Zero equipes com zero eventos significaria busca quebrada; zero equipes com
  # eventos de sobra significa que não há equipe cadastrada.
  #
  # O CONTROLE COMEÇOU ERRADO, e fica registrado. A primeira versão contava
  # ATLETAS, e ela NÃO PODIA passar: `searchService.js` recusa atleta à busca
  # anônima — "Sem autenticação, atleta não entra na busca: é dado de pessoa
  # física", e o ramo devolve lista vazia sem consultar o banco. O controle
  # reprovou e o job se recusou a concluir, que é o comportamento certo; o erro
  # foi escolher o controle sem ler o ramo primeiro.
  #
  # `events` serve porque é o caso simétrico ao de `teams`: mesma busca por
  # nome, mesma rota anônima, sem porteiro — e sabemos que há 47 deles.
  #
  # Tudo GET, tudo anônimo, nenhuma escrita. Contagens, nunca corpos.
  # ==========================================================================
  equipes:
    name: Equipes e empresas vazias — por quê
    needs: sondar
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api || 'https://mci-platform-api.onrender.com' }}
    steps:
      - name: Varrer a busca pública por equipes
        run: |
          TOTAL_EQ=0; TOTAL_AT=0; TERMOS=0
          for T in ar er os as te in an ra co de do da es re ma ta la ca na li sa to ro mo pa al ei ia ou; do
            curl -sS -m 60 -o /tmp/b.json --get --data-urlencode "q=$T" --data-urlencode 'types=teams,events' --data-urlencode 'limit=50' "$API/api/v1/search"
            EQ="$(jq -r '.results.teams  | length' /tmp/b.json 2>/dev/null || echo 0)"
            AT="$(jq -r '.results.events | length' /tmp/b.json 2>/dev/null || echo 0)"
            printf '  %-4s equipes %-3s · eventos %s\n' "$T" "$EQ" "$AT"
            TOTAL_EQ=$((TOTAL_EQ + EQ)); TOTAL_AT=$((TOTAL_AT + AT)); TERMOS=$((TERMOS + 1))
          done
          echo
          echo "$TERMOS bigramas · equipes encontradas: $TOTAL_EQ · eventos encontrados: $TOTAL_AT"
          echo "TOTAL_EQ=$TOTAL_EQ" >> "$GITHUB_ENV"
          echo "TOTAL_AT=$TOTAL_AT" >> "$GITHUB_ENV"
          echo "TERMOS=$TERMOS"     >> "$GITHUB_ENV"

      - name: O controle — a busca está achando alguma coisa
        run: |
          # Sem este passo a varredura acima não conclui nada: uma busca
          # quebrada devolveria zero equipes exatamente como um banco sem
          # equipe nenhuma.
          if [ "$TOTAL_AT" -gt 0 ]; then
            echo "Controle OK: a mesma busca, nos mesmos termos, achou $TOTAL_AT eventos."
          else
            echo "::error::Controle FALHOU: a busca não achou evento nenhum em $TERMOS termos. A varredura de equipes não conclui nada — o instrumento é que está mudo."
            exit 1
          fi

      - name: Veredito
        run: |
          if [ "$TOTAL_EQ" = "0" ]; then
            V="Nenhuma equipe existe: $TERMOS bigramas, zero resultados, com a busca comprovadamente viva ($TOTAL_AT eventos nos mesmos termos)."
            echo "$V"
            echo "A tabela de equipes está vazia por falta de CADASTRO, não de pontos."
          else
            V="Existem equipes cadastradas ($TOTAL_EQ achadas). A hipótese do cadastro ausente NÃO explica o ranking vazio — a causa é outra, e precisa de medição do lado autenticado."
            echo "::warning::$V"
          fi
          {
            echo '## Equipes e empresas vazias'
            echo
            echo "$V"
            echo
            echo '`/teams` e `/companies` exigem token e esta sonda não usa credencial;'
            echo 'a contagem acima vem da busca pública, que enxerga `Team` por nome.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # A INTERFACE ESTÁ NO AR?
  #
  # A API foi medida; o site, não. O `render.yaml` declara dois serviços —
  # `mci-api` e `mci-web` —, e o Render sufixa o nome com caracteres
  # aleatórios, então o nome do site é um palpite até alguém perguntar a ele.
  #
  # Este job NÃO reprova a execução: ele RELATA. Errar o palpite da URL não é
  # a produção estar fora do ar, e tratar as duas coisas como a mesma falha
  # ensinaria a ignorar o vermelho.
  # ==========================================================================
  interface:
    name: A interface está no ar
    needs: sondar
    runs-on: ubuntu-latest
    steps:
      - name: Perguntar aos candidatos
        run: |
          for U in https://mci-platform-web.onrender.com https://mci-web.onrender.com; do
            H="$(printf '%s' "$U" | sed -E 's#^https?://##')"
            if ! getent hosts "$H" > /dev/null; then
              echo "$U → o host não resolve"
              continue
            fi
            C="$(curl -sS -m 120 -o /tmp/w.html -w '%{http_code}' "$U" || echo 000)"
            TITULO="$(grep -oiE '<title>[^<]*</title>' /tmp/w.html | head -1 | sed -E 's#</?[Tt][Ii][Tt][Ll][Ee]>##g')"
            # Uma SPA responde 200 com o index em qualquer caminho. O que diz
            # que é ESTA aplicação é o título, não o código.
            echo "$U → HTTP $C · título: ${TITULO:-(sem título)}"
          done

  # ==========================================================================
  # DEMO = 0 EM PRODUÇÃO — o que esta sonda PODE e o que NÃO PODE provar.
  #
  # PODE: varrer as vistas públicas (campeonatos, filiações, ranking) atrás dos
  # marcadores que esta fase usou nos ambientes de QA, e contar quantos
  # aparecem. Zero aqui é evidência real de que nenhum dado de QA vazou para as
  # superfícies que o público enxerga.
  #
  # NÃO PODE: contar por TABELA, listar ID, ou enxergar o que não é público —
  # a conta de serviço da federação, por exemplo, nunca aparece em rota
  # nenhuma (é essa a intenção do §12.5). Para isso seria preciso consultar o
  # banco de produção, e NENHUM workflow deste repositório tem `DATABASE_URL`:
  # não há um único `secrets.*` em `.github/workflows`. Conferido, não suposto.
  #
  # Então este job entrega evidência PARCIAL, e diz que é parcial. Chamar o
  # zero daqui de "DEMO = 0 no banco" seria afirmar o que não foi medido.
  #
  # SOMENTE LEITURA: só `GET`. Nenhum DELETE, UPDATE, TRUNCATE, backfill,
  # recompute ou importação. O job não tem credencial para escrever nem que
  # quisesse — todas as rotas de escrita exigem token, e ele não tem nenhum.
  #
  # O repositório é PÚBLICO: imprime contagens e vereditos, nunca corpos.
  # ==========================================================================
  demo:
    name: DEMO = 0 nas vistas públicas
    needs: sondar
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api || 'https://mci-platform-api.onrender.com' }}
    steps:
      - name: Varrer os marcadores de QA desta fase
        run: |
          set -u
          # Os marcadores que os ambientes de QA desta fase usaram, e mais os
          # genéricos. `Etapa QA do Autocadastro` e `Federação QA Autocadastro`
          # vêm de scripts/qa/autocadastro-automatico.mjs; `Etapa QA de
          # Responsividade` e `NPC Mato Grosso (QA)` vêm de
          # scripts/qa/responsividade.mjs.
          MARCADORES='DEMO|Etapa QA|Federação QA|Federacao QA|NPC Mato Grosso \(QA\)|QA-NPC-MT|Atleta QA|MARIANA QA|qa-auto-|qa-resp-|@mci\.local|federacao\.mci\.local|Sistema ·'

          TOTAL=0
          echo '| Vista pública | Itens | Marcadores DEMO/QA |' >> /tmp/demo.md
          echo '|---|---|---|' >> /tmp/demo.md

          sondar() {
            local rotulo="$1" rota="$2"
            local codigo n encontrados
            codigo="$(curl -sS -m 120 -o /tmp/d.json -w '%{http_code}' "$API$rota" || echo 000)"
            if [ "$codigo" != "200" ]; then
              echo "| $rotulo | HTTP $codigo | (não consultada) |" >> /tmp/demo.md
              echo "$rotulo → HTTP $codigo"
              return
            fi
            n="$(jq -r 'if type=="array" then length elif .items then (.items|length) else 0 end' /tmp/d.json 2>/dev/null || echo 0)"
            # `-c` conta LINHAS casadas; o JSON é achatado para uma linha por
            # item para que a contagem seja de ITENS, e não de ocorrências.
            encontrados="$(jq -r 'if type=="array" then .[] elif .items then .items[] else empty end | tostring' /tmp/d.json 2>/dev/null \
              | grep -icE "$MARCADORES" || true)"
            encontrados="${encontrados:-0}"
            TOTAL=$((TOTAL + encontrados))
            echo "$rotulo → $n itens, $encontrados com marcador"
            echo "| $rotulo | $n | $encontrados |" >> /tmp/demo.md
          }

          sondar 'Campeonatos'            '/api/v1/events?limit=100'
          sondar 'Filiações (vitrine)'    '/api/v1/public/affiliations'
          sondar 'Super Overall'          '/api/v1/ranking/super-overall'
          sondar 'Busca pública (DEMO)'   '/api/v1/search?q=DEMO'
          sondar 'Busca pública (QA)'     '/api/v1/search?q=QA'

          echo "DEMO_PUBLIC_COUNT=$TOTAL" >> "$GITHUB_ENV"

      - name: O veredito
        run: |
          {
            echo '## DEMO = 0 nas vistas públicas'
            echo
            cat /tmp/demo.md
            echo
            echo "**DEMO_PUBLIC_COUNT = ${DEMO_PUBLIC_COUNT}**"
            echo
            if [ "${DEMO_PUBLIC_COUNT}" = "0" ]; then
              echo 'Nenhum marcador de QA desta fase aparece nas vistas públicas de produção.'
            else
              echo '**ATENÇÃO — marcador encontrado.** NADA foi apagado: esta sonda é'
              echo 'somente leitura. Ver a tabela acima para saber em qual vista.'
            fi
            echo
            echo '### O alcance desta medição'
            echo
            echo 'Evidência **parcial, e assumidamente parcial**: só enxerga o que é'
            echo 'público. Contagem por tabela, ID e marcador exigiria consultar o banco'
            echo 'de produção, e nenhum workflow deste repositório tem `DATABASE_URL` —'
            echo 'não há um único `secrets.*` em `.github/workflows`.'
            echo
            echo 'Somente leitura: apenas `GET`, sem token, sem rota de escrita.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${DEMO_PUBLIC_COUNT}" != "0" ]; then
            echo "DEMO_PUBLIC_COUNT=${DEMO_PUBLIC_COUNT} — parando para tratamento humano"
            exit 1
          fi

  # ==========================================================================
  # O CARTÃO "RESULTADOS PUBLICADOS" E A ENTIDADE OFICIAL, EM PRODUÇÃO
  #
  # POR QUE ESTE JOB EXISTE
  #
  # O cartão marcava ZERO com o ledger cheio: os dois endpoints contavam
  # `Result WHERE status = 'PUBLISHED'`, tabela em que só a recepção de apuração
  # escreve — e o histórico importado, que é a maior parte do acervo desta
  # plataforma, não passa por ali. Ver §20 de docs/AUDITORIA-FINAL-E2E.md.
  #
  # E O CAMPO "ENTIDADE DE FILIAÇÃO" APARECIA VAZIO na tela do atleta, porque a
  # entidade oficial e o estado do autocadastro existiam apenas como clique
  # manual. Ver §3.4 de docs/DEPLOY.md.
  #
  # As duas correções foram medidas contra banco local. Este job mede NO AR.
  #
  # E ELE RESOLVE UM TERCEIRO PROBLEMA: não havia meio confiável de saber QUAL
  # versão está implantada — nada na aplicação expõe o commit. O campo
  # `publishedResultsBreakdown` nasceu com a correção do cartão, então a
  # presença dele na resposta é evidência COMPORTAMENTAL de que o código novo
  # está no ar. Não é o SHA; é a pergunta que o SHA responderia.
  #
  # SOMENTE LEITURA, ANÔNIMO: dois GET em rotas que já são públicas. Nenhuma
  # escrita, nenhum token, nenhuma credencial.
  #
  # O log é público, então saem CONTAGENS e nunca o corpo. As contagens saem
  # TAMBÉM COMO ANOTAÇÃO porque o log de Actions fica em
  # results-receiver.actions.githubusercontent.com, que a política de egresso
  # deste projeto recusa: medir e não conseguir ler a medição é o mesmo que não
  # medir.
  # ==========================================================================
  cartao:
    name: O cartão e a entidade oficial, no ar
    needs: sondar
    runs-on: ubuntu-latest
    env:
      API: ${{ inputs.api || 'https://mci-platform-api.onrender.com' }}
    steps:
      - name: Medir o resumo público
        run: |
          set -u
          CODIGO="$(curl -sS -m 120 -o /tmp/s.json -w '%{http_code}' "$API/api/v1/public/summary" || echo 000)"
          echo "HTTP $CODIGO"
          [ "$CODIGO" = "200" ] || { echo "::error::/public/summary respondeu $CODIGO, e o esperado é 200."; exit 1; }

          TOTAL="$(jq -r '.publishedResults // "ausente"' /tmp/s.json)"
          TEM="$(jq -r 'if has("publishedResultsBreakdown") then "sim" else "nao" end' /tmp/s.json)"
          RECEBIDOS="$(jq -r '.publishedResultsBreakdown.received // "-"' /tmp/s.json)"
          IMPORTADOS="$(jq -r '.publishedResultsBreakdown.imported // "-"' /tmp/s.json)"
          EVENTOS="$(jq -r '.events // "-"' /tmp/s.json)"

          echo "publishedResults ............. $TOTAL"
          echo "composição presente .......... $TEM"
          echo "  recebidos no MCI ........... $RECEBIDOS"
          echo "  do histórico importado ..... $IMPORTADOS"
          echo "campeonatos na vitrine ....... $EVENTOS"

          echo "::notice title=Cartão em producao::publishedResults=$TOTAL composicao=$TEM recebidos=$RECEBIDOS importados=$IMPORTADOS campeonatos=$EVENTOS"

          {
            echo '## O cartão de resultados publicados, no ar'
            echo
            echo '| Medição | Valor |'
            echo '|---|---|'
            echo "| \`publishedResults\` | $TOTAL |"
            echo "| composição presente | $TEM |"
            echo "| recebidos no MCI | $RECEBIDOS |"
            echo "| do histórico importado | $IMPORTADOS |"
            echo "| campeonatos na vitrine | $EVENTOS |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A AUSÊNCIA DA COMPOSIÇÃO NÃO É FALHA DA PRODUÇÃO: é a versão antiga
          # ainda no ar. O job relata a diferença em vez de confundir as duas.
          if [ "$TEM" != "sim" ]; then
            {
              echo
              echo '**A versão no ar é ANTERIOR à correção** — o campo de composição não veio.'
              echo 'Aguardar o deploy do Render e sondar de novo. Não é indisponibilidade.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::A versão no ar ainda não tem a correção do cartão (composição ausente)."
            exit 0
          fi

          # Com a correção no ar, o total tem de ser a soma das duas parcelas.
          # Se não for, a conta está errada em produção — e isso é falha.
          SOMA=$((RECEBIDOS + IMPORTADOS))
          if [ "$TOTAL" != "$SOMA" ]; then
            echo "::error::O total ($TOTAL) não é a soma das parcelas ($RECEBIDOS + $IMPORTADOS = $SOMA)."
            exit 1
          fi
          echo "PASS — a correção do cartão está no ar, e o total confere com as parcelas."

      # ------------------------------------------------------------------
      # A ENTIDADE DE FILIAÇÃO OFICIAL, NO AR.
      #
      # O sintoma que abriu a fase da NPC foi o campo "Entidade de filiação"
      # vazio na tela do atleta, e a vitrine devolvendo lista vazia. Esta é a
      # rota que a tela consome, e é a única forma de saber, de fora, se o
      # provisionamento chegou a produção.
      #
      # NÃO REPROVA COM A VITRINE VAZIA. Uma federação pode legitimamente manter
      # o autocadastro fechado, e `MCI_NPC_ORGANIZATION_ID` pode não estar
      # configurada no ambiente — os dois são estados ADMINISTRATIVOS, não
      # indisponibilidade. Tratar decisão da federação como falha ensinaria a
      # ignorar o vermelho. O job RELATA, e o resumo diz qual dos casos é.
      #
      # `continue-on-error` NÃO é usado aqui: o passo não falha por construção, e
      # esconder falha com bandeira de tolerância é o oposto de medir.
      # ------------------------------------------------------------------
      - name: A entidade de filiação oficial está na vitrine
        run: |
          set -u
          OFICIAL='NPC - National Physique Committe'
          CODIGO="$(curl -sS -m 120 -o /tmp/f.json -w '%{http_code}' "$API/api/v1/public/affiliations" || echo 000)"
          echo "HTTP $CODIGO"
          [ "$CODIGO" = "200" ] || { echo "::error::/public/affiliations respondeu $CODIGO, e o esperado é 200."; exit 1; }

          N="$(jq -r '.items | length' /tmp/f.json 2>/dev/null || echo 0)"
          COM_NOME="$(jq -r --arg n "$OFICIAL" '[.items[]? | select(.name == $n)] | length' /tmp/f.json 2>/dev/null || echo 0)"
          CODIGOS="$(jq -r '[.items[]?.code] | join(",")' /tmp/f.json 2>/dev/null || echo '')"
          KIND="$(jq -r --arg n "$OFICIAL" '[.items[]? | select(.name == $n) | .kind] | join(",")' /tmp/f.json 2>/dev/null || echo '')"

          echo "entidades na vitrine ......... $N"
          echo "com o nome oficial ........... $COM_NOME"
          echo "códigos ...................... ${CODIGOS:-(nenhum)}"
          echo "kind da oficial .............. ${KIND:-(ausente)}"

          echo "::notice title=Entidade oficial em producao::entidades=$N comNomeOficial=$COM_NOME codigos=${CODIGOS:-nenhum} kind=${KIND:-ausente}"

          {
            echo
            echo '## A entidade de filiação oficial, no ar'
            echo
            echo '| Medição | Valor |'
            echo '|---|---|'
            echo "| entidades na vitrine | $N |"
            echo "| com o nome oficial | $COM_NOME |"
            echo "| códigos | ${CODIGOS:-(nenhum)} |"
            echo "| kind da oficial | ${KIND:-(ausente)} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COM_NOME" != "0" ]; then
            echo 'A entidade oficial ESTÁ na vitrine: o atleta pode selecioná-la.' >> "$GITHUB_STEP_SUMMARY"
            echo "PASS — a entidade oficial está no ar."
          elif [ "$N" = "0" ]; then
            {
              echo '**Vitrine VAZIA.** Nenhuma federação tem autocadastro aberto, ou'
              echo '`MCI_NPC_ORGANIZATION_ID` não está configurada no ambiente. Os dois são'
              echo 'estados administrativos: o provisionamento não os adivinha, e este job'
              echo 'não os trata como indisponibilidade.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::A vitrine de filiações está vazia — ver o resumo do job."
          else
            echo '**A vitrine tem entidade, mas nenhuma com o nome oficial.** Ver os códigos acima.' >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Há entidade na vitrine, mas nenhuma com o nome oficial."
          fi
