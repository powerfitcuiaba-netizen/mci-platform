# ==========================================================================
# MCI Platform — blueprint do Render.
#
# Três peças, porque a aplicação é três peças:
#   mci-api    a API em Node, pela imagem do Dockerfile já existente
#   mci-web    o bundle estático do Vite (o backend NÃO serve arquivo estático)
#   mci-db     PostgreSQL gerenciado
#
# ATENÇÃO — ESTE ARQUIVO NÃO FOI VALIDADO CONTRA O RENDER.
# O ambiente onde ele foi escrito tem egress bloqueado para render.com, então
# não foi possível conferir o schema contra a documentação vigente nem aplicar
# o blueprint de verdade. Os nomes de campo vêm de conhecimento prévio e o
# Render muda o schema de tempos em tempos. Confira em
# https://render.com/docs/blueprint-spec antes de aplicar, e trate um erro de
# validação como esperado, não como defeito da plataforma.
#
# O caminho pelo painel, criando os três serviços à mão, não depende deste
# arquivo e está descrito em docs/DEPLOY-RENDER.md.
#
# O QUE NÃO ESTÁ AQUI, DE PROPÓSITO
#
# Nenhum segredo. JWT_SECRET é gerado pelo próprio Render; as credenciais do
# Cloudflare R2 entram pelo painel (`sync: false` faz o Render perguntar em vez
# de versionar). Nada de valor sensível pode viver neste arquivo — ele vai para
# o repositório.
#
# DUAS PASSAGENS, e isso não é contornável
#
# A API precisa saber a origem do frontend (CORS_ORIGINS) e o frontend precisa
# saber a URL da API (VITE_API_URL). Nenhuma das duas existe antes de os
# serviços serem criados. Então: aplique o blueprint, anote as duas URLs,
# preencha as duas variáveis e redeploy. O VITE_API_URL é lido em tempo de
# BUILD — o Vite grava o valor dentro do bundle —, portanto mudá-lo exige
# reconstruir o frontend, não só salvar a variável.
# ==========================================================================

databases:
  - name: mci-db
    databaseName: mci
    user: mci
    # O plano gratuito do Render expira sozinho depois de um período. Para um
    # campeonato nacional isso não serve: escolha um plano pago antes de
    # cadastrar atleta de verdade.
    plan: free
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: mci-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Ver a nota do plano free abaixo, em "O QUE OBSERVAR".
    plan: free
    region: oregon
    healthCheckPath: /health

    # ANTES DE A NOVA VERSÃO RECEBER TRÁFEGO, e nesta ordem:
    #
    #   1. `prisma migrate deploy` — a ESTRUTURA (colunas, índices, políticas);
    #   2. `provisionar-contas-de-servico.js` — o DADO que a estrutura não
    #      cria: a conta de serviço de cada federação que já existia.
    #
    # A ORDEM É OBRIGATÓRIA e o gancho também. A conta de serviço nasce junto
    # com a organização (`organizationService.create`), mas as federações
    # anteriores a esta versão foram criadas antes disso — e migration altera
    # estrutura, não cria linha. Sem o passo 2, `POST /athlete-requests`
    # responde 503 SERVICE_ACCOUNT_MISSING para TODAS elas, e o sintoma só
    # aparece quando o primeiro atleta tenta se cadastrar.
    #
    # `preDeployCommand` é o único lugar onde isso cabe: roda depois de o banco
    # estar migrado e ANTES de o autocadastro novo ficar disponível. Se
    # falhar, o Render não promove a versão — e é o que se quer: a versão
    # antiga, sem conclusão automática, continua no ar e ninguém fica com
    # autocadastro quebrado.
    #
    # O script é IDEMPOTENTE e só faz INSERT: no deploy seguinte ele encontra
    # tudo provisionado, imprime "nada a fazer" e sai com 0. Numa instalação
    # nova, sem federação nenhuma, também sai com 0 — ele só exige
    # PROVISIONAR_ADMIN_EMAIL quando existe federação de verdade a provisionar.
    #
    # Se o seu plano não oferecer preDeployCommand, remova esta linha e rode os
    # DOIS comandos, nesta ordem, pelo shell do serviço, ANTES de promover.
    preDeployCommand: npx prisma migrate deploy && node scripts/provisionar-contas-de-servico.js

    envVars:
      - key: NODE_ENV
        value: production

      # QUEM AUTORIZA O PROVISIONAMENTO das federações que já existiam.
      #
      # `sync: false` porque o valor é decisão de quem opera, não algo que o
      # repositório deva fixar. Preencha com o e-mail de um ADMIN ou
      # SUPER_ADMIN existente: a auditoria registra `SERVICE_ACCOUNT_PROVISIONED`
      # em nome dele, porque foi ele quem mandou rodar.
      #
      # Só é lido quando há federação sem conta. Numa instalação nova, ou num
      # deploy em que tudo já foi provisionado, o script nem chega a consultá-lo.
      - key: PROVISIONAR_ADMIN_EMAIL
        sync: false

      # QUAL ORGANIZAÇÃO É A OFICIAL DO CAMPEONATO — a dona da entidade
      # `NPC - National Physique Committe`.
      #
      # `sync: false` porque é um id do banco de produção, e o repositório é
      # público: fixá-lo aqui seria versionar configuração de ambiente.
      #
      # POR QUE UMA VARIÁVEL, E NÃO DESCOBERTA PELO SISTEMA
      #
      # Resolver a organização por semelhança de nome, ou pela primeira que o
      # banco devolver, é como se provisiona a federação errada em silêncio — e
      # aí a entidade oficial nasce pendurada em quem não é dono dela, com
      # histórico atrás. O id é declarado, e nenhuma outra organização é
      # escolhida no lugar dele.
      #
      # RESPONSABILIDADE ÚNICA, e por isso não se reaproveita
      # `PROVISIONAR_ADMIN_EMAIL`: derivar a organização do vínculo de quem
      # autoriza o deploy faria a federação oficial mudar quando trocasse o
      # administrador.
      #
      # Ausente: o script NÃO verifica a entidade oficial e diz isso no log;
      # o deploy segue. Apontando para organização inexistente ou inativa, ou
      # havendo conflito de entidade: o script FALHA e o Render não promove a
      # versão — o que é o comportamento certo, porque uma federação sem a
      # entidade no ar tem o autocadastro quebrado.
      - key: MCI_NPC_ORGANIZATION_ID
        sync: false

      # A string vem do banco gerenciado; ninguém digita credencial.
      - key: DATABASE_URL
        fromDatabase:
          name: mci-db
          property: connectionString

      # Gerado pelo Render, nunca escrito aqui. Trocar este valor desloga todo
      # mundo — é o efeito esperado, não um defeito.
      - key: JWT_SECRET
        generateValue: true

      # Preencher DEPOIS de o mci-web existir, com a URL completa, incluindo
      # https://. A aplicação recusa subir sem isto, e recusa curinga `*`.
      - key: CORS_ORIGINS
        sync: false

      # Mínimo exigido pela validação de produção é 10.
      - key: BCRYPT_ROUNDS
        value: "12"

      - key: RATE_LIMIT_ENABLED
        value: "true"

      # O Render põe um proxy à frente do serviço. Com 0, o limitador leria o
      # IP do proxy e limitaria o mundo inteiro junto.
      - key: TRUST_PROXY_HOPS
        value: "1"

      - key: LOG_LEVEL
        value: "info"

      - key: DEFAULT_TIMEZONE
        value: America/Sao_Paulo

      # ---- Armazenamento: Cloudflare R2, compatível com S3 ----
      # Sem isto a aplicação recusa subir, a menos que se assuma o risco de
      # disco efêmero com ALLOW_LOCAL_STORAGE=true — que no Render significa
      # perder todo upload no primeiro redeploy.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT      # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # O R2 usa "auto" como região e exige endereçamento por caminho.
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"

  # ------------------------------------------------------- FRONTEND ESTÁTICO
  - type: web
    name: mci-web
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Preencher DEPOIS de o mci-api existir: https://mci-api-XXXX.onrender.com/api/v1
      # Lido em tempo de BUILD. Mudou? Reconstrua o site, não basta salvar.
      - key: VITE_API_URL
        sync: false
    routes:
      # A interface é uma SPA: qualquer caminho precisa cair no index.html, ou
      # recarregar a página em /ranking devolve 404 do servidor de arquivos.
      - type: rewrite
        source: /*
        destination: /index.html
